name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: llm-mem-mcp

jobs:
  # ─── Build matrix with NATIVE targets only ───────────────────────────
  build:
    name: Build ${{ matrix.target }} (native)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux x86_64 (native) ─────────────────────────────────────
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            artifact: llm-mem-mcp-linux-x86_64
            rust_toolchain: stable

          # ── Linux aarch64 (native on ARM64 runner) ────────────────────
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            artifact: llm-mem-mcp-linux-aarch64
            rust_toolchain: stable

          # ── macOS Apple Silicon (native on M1 Mac) ────────────────────
          - target: aarch64-apple-darwin
            os: macos-15
            artifact: llm-mem-mcp-macos-aarch64
            rust_toolchain: stable

          # ── Windows x86_64 (native) ───────────────────────────────────
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            artifact: llm-mem-mcp-windows-x86_64
            rust_toolchain: stable

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust_toolchain }}
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - name: Cache cargo registry & build
        uses: actions/cache@v4.2.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/${{ matrix.target }}/release
          key: ${{ runner.os }}-${{ matrix.target }}-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-release-
            ${{ runner.os }}-${{ matrix.target }}-

      # ── Linux native deps ────────────────────────────────────────────
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            g++ \
            clang \
            pkg-config \
            libssl-dev \
            libclang-dev \
            protobuf-compiler \
            glslc

      - name: Install Vulkan SDK (Linux)
        if: runner.os == 'Linux'
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: latest
          vulkan-components: Vulkan-Headers, Vulkan-Loader, Glslang, SPIRV-Tools
          vulkan-use-cache: false

      - name: Add Vulkan SDK to PATH
        if: runner.os == 'Linux'
        run: |
          echo "$VULKAN_SDK/bin" >> "$GITHUB_PATH"

      # ── macOS native deps ────────────────────────────────────────────
      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install cmake ninja protobuf
          clang --version

      # ── Windows native deps ──────────────────────────────────────────
      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # GH runners have LLVM, CMake, Ninja pre-installed. 
          # We just need to ensure they are in PATH and set LIBCLANG_PATH.
          $llvmPath = "C:\Program Files\LLVM\bin"
          if (Test-Path $llvmPath) {
              echo "$llvmPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              echo "LIBCLANG_PATH=$llvmPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          
          # OpenSSL is also usually at C:\Program Files\OpenSSL-Win64
          $opensslPath = "C:\Program Files\OpenSSL-Win64"
          if (Test-Path $opensslPath) {
              echo "OPENSSL_DIR=$opensslPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          } else {
              choco install -y openssl
              # choco installs to the same standard path
              echo "OPENSSL_DIR=$opensslPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

          # protoc is required by lance-encoding's build script (prost-build)
          choco install -y protoc

      # ── Windows Vulkan SDK ───────────────────────────────────────────
      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Fetch the latest SDK version
          $versionUrl = "https://vulkan.lunarg.com/sdk/latest/windows.txt"
          $version = (Invoke-WebRequest -Uri $versionUrl -UseBasicParsing).Content.Trim()
          Write-Host "Installing Vulkan SDK $version"

          # Download the SDK installer (canonical filename is vulkan_sdk.exe)
          $installerUrl = "https://sdk.lunarg.com/sdk/download/$version/windows/vulkan_sdk.exe"
          $installerPath = "$env:TEMP\vulkan_sdk.exe"
          Write-Host "Downloading from $installerUrl"
          Invoke-WebRequest -Uri $installerUrl -OutFile $installerPath

          # Silent install to a known path
          $installDir = "C:\VulkanSDK\$version"
          Write-Host "Installing to $installDir"
          Start-Process -FilePath $installerPath -ArgumentList "--root", $installDir, "--accept-licenses", "--default-answer", "--confirm-command", "install" -Wait -NoNewWindow

          # Set environment variables
          echo "VULKAN_SDK=$installDir" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "$installDir\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "VULKAN_SDK=$VULKAN_SDK"
          ls "$VULKAN_SDK/Include/vulkan/vulkan.h" || { echo "ERROR: Vulkan headers not found"; exit 1; }
          ls "$VULKAN_SDK/Lib/vulkan-1.lib" || { echo "ERROR: Vulkan library not found"; exit 1; }
          glslc --version || echo "WARNING: glslc not in PATH"
          echo "Vulkan SDK verified successfully"

      # ── Normalize Vulkan SDK path (Windows) ──────────────────────────
      - name: Normalize VULKAN_SDK path (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          VULKAN_SDK_FWD="${VULKAN_SDK//\\//}"
          echo "VULKAN_SDK=$VULKAN_SDK_FWD" >> "$GITHUB_ENV"
          echo "CMAKE_PREFIX_PATH=$VULKAN_SDK_FWD" >> "$GITHUB_ENV"

      # ── Determine Features ───────────────────────────────────────────
      - name: Determine features
        shell: bash
        run: |
          if [[ "${{ runner.os }}" == "Windows" ]] || [[ "${{ runner.os }}" == "Linux" ]]; then
            echo "FEATURES=local,vulkan" >> "$GITHUB_ENV"
          else
            echo "FEATURES=local,metal" >> "$GITHUB_ENV"
          fi

      # ── Build ────────────────────────────────────────────────────────
      - name: Configure Windows MSVC build
        if: runner.os == 'Windows'
        shell: bash
        # Use Ninja on Windows to avoid vulkan-shaders-gen ExternalProject
        # failure with the Visual Studio MSBuild generator.
        # CL=/FS forces synchronous PDB writes: MSVC reads the CL env var on
        # every cl.exe invocation (including CMake's nested ExternalProject
        # compiler test), preventing C1041 under parallel builds.
        # CMAKE_DISABLE_FIND_PACKAGE_OpenSSL stops llama.cpp's vendored
        # cpp-httplib from linking the runner's OpenSSL 4.x (which breaks the
        # old httplib code). It's unused since LLAMA_BUILD_SERVER=OFF, and the
        # Rust native-tls path is unaffected (it uses OPENSSL_DIR directly).
        # CARGO_TARGET_DIR shortens the build tree: the nested vulkan-shaders-gen
        # ExternalProject produces object paths >250 chars under the default
        # target/ dir, exceeding MSVC's path limit (C1041).
        run: |
          {
            echo "CMAKE_GENERATOR=Ninja"
            echo "CL=/FS"
            echo "CMAKE_DISABLE_FIND_PACKAGE_OpenSSL=TRUE"
            echo "CARGO_TARGET_DIR=D:/b"
          } >> "$GITHUB_ENV"
          # Exclude the workspace from Windows Defender real-time scanning;
          # Defender locking freshly-written .pdb files is a known C1041 cause.
          powershell -NoProfile -Command "Add-MpPreference -ExclusionPath \"$GITHUB_WORKSPACE\" -Force" || true

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }} --bin ${{ env.BINARY_NAME }} --features "${{ env.FEATURES }}"
        env:
          # Force dynamic CRT on Windows so esaxx_rs (/MT) doesn't conflict
          # with ort_sys prebuilt ONNX Runtime (/MD).
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=-crt-static' || '' }}

      # ── Run clippy on native build ───────────────────────────────────
      - name: Run clippy (release mode)
        run: cargo clippy --release --target ${{ matrix.target }} --bin ${{ env.BINARY_NAME }} --features "${{ env.FEATURES }}" 

      # ── Package ──────────────────────────────────────────────────────
      - name: Package binary (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          strip ${{ env.BINARY_NAME }} 2>/dev/null || true
          tar czf ../../../${{ matrix.artifact }}.tar.gz ${{ env.BINARY_NAME }}
          cd ../../..
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum ${{ matrix.artifact }}.tar.gz > ${{ matrix.artifact }}.tar.gz.sha256
          else
            shasum -a 256 ${{ matrix.artifact }}.tar.gz > ${{ matrix.artifact }}.tar.gz.sha256
          fi

      - name: Package binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binDir = "$env:CARGO_TARGET_DIR\${{ matrix.target }}\release"
          # Bundle the Vulkan loader so the binary runs without a separate
          # Vulkan runtime install (and the smoke test passes on a clean runner).
          # The SDK installer runs VulkanRT.exe, which puts vulkan-1.dll in
          # System32 (not in the SDK's Bin dir).
          Copy-Item "$env:WINDIR\System32\vulkan-1.dll" -Destination $binDir -ErrorAction Stop
          Compress-Archive -Path "$binDir\${{ env.BINARY_NAME }}.exe", "$binDir\vulkan-1.dll" -DestinationPath "$env:GITHUB_WORKSPACE\${{ matrix.artifact }}.zip" -Force
          $hash = Get-FileHash -Path "$env:GITHUB_WORKSPACE\${{ matrix.artifact }}.zip" -Algorithm SHA256
          "$($hash.Hash) ${{ matrix.artifact }}.zip" > "$env:GITHUB_WORKSPACE\${{ matrix.artifact }}.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.${{ runner.os == 'Windows' && 'zip' || 'tar.gz' }}
            ${{ matrix.artifact }}.${{ runner.os == 'Windows' && 'zip' || 'tar.gz' }}.sha256
          if-no-files-found: error

  # ─── Build self-contained AppImages (Linux only) ─────────────────────
  appimage:
    name: Build AppImage (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-24.04
            manylinux_image: quay.io/pypa/manylinux_2_28_x86_64
            artifact: llm-mem-mcp-x86_64.AppImage
            targetarch: amd64
          - arch: aarch64
            os: ubuntu-24.04-arm
            manylinux_image: quay.io/pypa/manylinux_2_28_aarch64
            artifact: llm-mem-mcp-aarch64.AppImage
            targetarch: arm64

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          df -h /

      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build AppImage
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/appimage/Dockerfile
          platforms: linux/${{ matrix.targetarch }}
          build-args: |
            BASE_IMAGE=${{ matrix.manylinux_image }}
            TARGETARCH=${{ matrix.targetarch }}
            FEATURES=local
          outputs: type=local,dest=dist
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Multicall sanity check
        shell: bash
        run: |
          APPIMAGE="dist/${{ matrix.artifact }}"
          echo "==> Verifying AppRun multicall dispatch ($APPIMAGE):"
          APPIMAGE_EXTRACT_AND_RUN=1 "$APPIMAGE" --version
          LLM_MEM_BIN=cli APPIMAGE_EXTRACT_AND_RUN=1 "$APPIMAGE" --version

      - name: Generate SHA256
        shell: bash
        run: |
          cd dist
          sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          cat "${{ matrix.artifact }}.sha256"

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}
            dist/${{ matrix.artifact }}.sha256
          if-no-files-found: error

  # ─── Create GitHub Release ───────────────────────────────────────────
  release:
    name: Create Release
    needs: [build, appimage]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          # Only the release artifacts; skip Docker build-cache blobs
          # (*.dockerbuild) that build-push-action uploads via cache-to: gha.
          pattern: llm-mem-mcp-*

      - name: Collect release files
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.sha256' -o -name '*.zip' -o -name '*.AppImage' \) \
            -exec mv {} release-files/ \;
          echo "── Release files ──"
          ls -lh release-files/

      - name: Generate release notes
        id: notes
        run: |
          cat > release-files/RELEASE_NOTES.md << 'NOTES_EOF'
          ## llm-mem Release

          Standalone MCP memory server with embedded vector store for AI agents.

          ### Installation

          Download the archive for your platform, extract, and run:

          ```bash
          # Linux/macOS
          tar xzf llm-mem-mcp-<platform>.tar.gz
          ./llm-mem-mcp --help

          # Windows
          Expand-Archive llm-mem-mcp-windows-x86_64.zip
          .\llm-mem-mcp.exe --help
          ```

          ### Platforms (Native Builds)

          | Archive | Platform | Architecture | GPU Acceleration |
          |---------|----------|--------------|------------------|
          | `llm-mem-mcp-linux-x86_64.tar.gz` | Linux (Ubuntu 24.04+) | x86_64 | ✅ Vulkan |
          | `llm-mem-mcp-linux-aarch64.tar.gz` | Linux ARM64 | aarch64 | ✅ Vulkan |
          | `llm-mem-mcp-macos-aarch64.tar.gz` | macOS 15+ (Apple Silicon) | ARM64 | ✅ Metal |
          | `llm-mem-mcp-windows-x86_64.zip` | Windows 10/11 | x86_64 | ✅ Vulkan |

          **Notes:**
          - GPU acceleration: Vulkan on Linux/Windows, Metal on macOS
          - On first run, models are auto-downloaded from Hugging Face (~1 GB)

          ### Linux AppImages (self-contained, portable)

          Single-file executables for any modern Linux distro (glibc >= 2.28):
          Ubuntu 20.04+, Debian 11+, RHEL 9+, Fedora, Arch, openSUSE. They bundle
          their own libraries and need no FUSE.

          | AppImage | Architecture |
          |----------|--------------|
          | `llm-mem-mcp-x86_64.AppImage` | x86_64 |
          | `llm-mem-mcp-aarch64.AppImage` | aarch64 |

          ```bash
          chmod +x llm-mem-mcp-x86_64.AppImage
          ./llm-mem-mcp-x86_64.AppImage --help
          ```

          ### Verify download

          ```bash
          # Linux/macOS
          sha256sum -c llm-mem-mcp-<platform>.tar.gz.sha256

          # Windows (PowerShell)
          Get-FileHash llm-mem-mcp-<platform>.zip -Algorithm SHA256
          ```

          ### Features

          - **local**: Local LLM inference via llama.cpp (GGUF models)
          - **metal**: GPU acceleration via Metal (macOS)
          - **vulkan**: GPU acceleration via Vulkan (Linux/Windows)
          NOTES_EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-files/*
          body_path: release-files/RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─── Smoke tests on native platforms ─────────────────────────────────
  smoke-test:
    name: Smoke test ${{ matrix.artifact }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: llm-mem-mcp-linux-x86_64
            os: ubuntu-24.04
          - artifact: llm-mem-mcp-linux-aarch64
            os: ubuntu-24.04-arm
          - artifact: llm-mem-mcp-macos-aarch64
            os: macos-15
          - artifact: llm-mem-mcp-windows-x86_64
            os: windows-2022
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}

      - name: Install runtime dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan1

      - name: Extract and test (Unix)
        if: runner.os != 'Windows'
        run: |
          tar xzf ${{ matrix.artifact }}.tar.gz
          chmod +x llm-mem-mcp
          ./llm-mem-mcp --version
          ./llm-mem-mcp --help
          echo "✓ Smoke test passed for ${{ matrix.artifact }}"

      - name: Extract and test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Expand-Archive -Path ${{ matrix.artifact }}.zip -DestinationPath .
          .\llm-mem-mcp.exe --version
          .\llm-mem-mcp.exe --help
          echo "✓ Smoke test passed for ${{ matrix.artifact }}"

  # ─── Integration tests (Linux x86_64 only) ───────────────────────────
  integration-test:
    name: Integration tests
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            g++ \
            clang \
            pkg-config \
            libssl-dev \
            libclang-dev \
            protobuf-compiler \
            glslc

      - name: Run cargo test
        run: |
          # Mock-LLM suite only. Dropping `local` skips the ~26 min
          # llama.cpp/fastembed compile and the ~38 min real-LLM inference
          # tests in functional_discovery.rs (covered separately in ci.yml).
          cargo test --release --no-default-features --features lancedb -- --test-threads=1

      - name: Run cargo clippy
        run: |
          cargo clippy --no-default-features --features lancedb
