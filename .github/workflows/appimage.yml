name: Build AppImage (manual)

# Manual-trigger workflow that produces self-contained llm-mem-mcp
# AppImages. The resulting artifacts are uploaded to the workflow run but
# NOT auto-published to a GitHub Release — the user can download them from
# the Actions UI when ready. This is intentional: it gives full control
# over release timing and lets the maintainer inspect artifacts before
# publishing.
#
# Trigger: GitHub UI → Actions → "Build AppImage" → Run workflow.
#
# The AppImage is built on a manylinux_2_28 base, statically links
# libstdc++/libgcc, dynamically links only glibc + (bundled) Vulkan
# loader. It runs on Ubuntu 20.04+, Debian 11+, RHEL 9+, Fedora, Arch,
# openSUSE, and any other modern Linux with glibc >= 2.28. Both x86_64
# and aarch64 are produced in parallel.

on:
  workflow_dispatch:
    inputs:
      features:
        description: "Cargo features to enable (space-separated)"
        required: false
        default: "local"
        type: string
      update_info:
        description: "AppImage update information string (leave blank for none)"
        required: false
        default: ""
        type: string

concurrency:
  group: appimage-build
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: llm-mem-mcp

jobs:
  # ─── Build matrix: x86_64 + aarch64 ─────────────────────────────────────
  build:
    name: Build AppImage (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux_image: quay.io/pypa/manylinux_2_28_x86_64
            artifact: llm-mem-mcp-x86_64.AppImage
            targetarch: amd64
          - arch: aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux_image: quay.io/pypa/manylinux_2_28_aarch64
            artifact: llm-mem-mcp-aarch64.AppImage
            targetarch: arm64

    steps:
      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          df -h /

      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build AppImage
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/appimage/Dockerfile
          platforms: linux/${{ matrix.targetarch }}
          build-args: |
            BASE_IMAGE=${{ matrix.manylinux_image }}
            TARGETARCH=${{ matrix.targetarch }}
            FEATURES=${{ github.event.inputs.features || 'local' }}
            UPDATE_INFO=${{ github.event.inputs.update_info }}
          outputs: type=local,dest=dist
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Multicall sanity check
        shell: bash
        run: |
          APPIMAGE="dist/${{ matrix.artifact }}"
          echo "==> Verifying AppRun multicall dispatch ($APPIMAGE):"
          APPIMAGE_EXTRACT_AND_RUN=1 "$APPIMAGE" --version
          LLM_MEM_BIN=cli APPIMAGE_EXTRACT_AND_RUN=1 "$APPIMAGE" --version

      - name: Verify AppImage
        shell: bash
        run: |
          APPIMAGE="dist/${{ matrix.artifact }}"
          if [[ ! -f "$APPIMAGE" ]]; then
            echo "ERROR: $APPIMAGE not found"; exit 1
          fi
          echo "==> File info:"
          file "$APPIMAGE"
          echo
          echo "==> Size:"
          du -h "$APPIMAGE"
          echo
          echo "==> Runtime version:"
          "$APPIMAGE" --appimage-version || true
          echo
          echo "==> Extract-and-run smoke test:"
          APPIMAGE_EXTRACT_AND_RUN=1 "$APPIMAGE" --version 2>&1 | head -3

      - name: Generate SHA256
        shell: bash
        run: |
          cd dist
          sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          cat "${{ matrix.artifact }}.sha256"

      - name: Upload AppImage as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}
            dist/${{ matrix.artifact }}.sha256
            dist/${{ matrix.artifact }}.zsync
          if-no-files-found: error
          retention-days: 30

  # ─── Cross-arch smoke test ──────────────────────────────────────────────
  # Validate the x86_64 AppImage on a fresh ubuntu-22.04 (glibc 2.35)
  # container to confirm the manylinux_2_28 base actually delivers the
  # promised forward compatibility.
  smoke-test:
    name: Smoke test (glibc ${{ matrix.glibc_version }})
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ubuntu:22.04
            glibc_version: "2.35"
            label: "Ubuntu 22.04 (glibc 2.35)"
          - image: ubuntu:20.04
            glibc_version: "2.31"
            label: "Ubuntu 20.04 (glibc 2.31)"

    steps:
      - uses: actions/checkout@v4

      - name: Download x86_64 AppImage
        uses: actions/download-artifact@v4
        with:
          name: llm-mem-mcp-x86_64.AppImage
          path: dist
          merge-multiple: true

      - name: Run AppImage in ${{ matrix.label }} container
        env:
          APPIMAGE_NAME: llm-mem-mcp-x86_64.AppImage
        run: |
          chmod +x "dist/${APPIMAGE_NAME}"
          docker run --rm \
            --privileged \
            --device /dev/fuse \
            -v "$PWD/dist:/dist:ro" \
            "${{ matrix.image }}" \
            bash -c "set -eux; \
              apt-get update -qq; \
              DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
                libfuse2 fuse \
                file ca-certificates > /dev/null 2>&1; \
              ldd --version | head -1; \
              cd /tmp; \
              APPIMAGE_EXTRACT_AND_RUN=1 /dist/${APPIMAGE_NAME} --version; \
              echo '✓ AppImage launches on ${{ matrix.label }}'"

  # ─── Print install instructions ─────────────────────────────────────────
  summary:
    name: Build summary
    needs: [build, smoke-test]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Print results
        run: |
          {
            echo "## AppImage build results"
            echo ""
            echo "Build job:    ${{ needs.build.result }}"
            echo "Smoke tests:  ${{ needs.smoke-test.result }}"
            echo ""
            echo "### Install (user)"
            echo ""
            echo '```bash'
            echo '# Download llm-mem-mcp-x86_64.AppImage from the workflow artifacts'
            echo 'mkdir -p ~/.local/bin'
            echo 'mv llm-mem-mcp-x86_64.AppImage ~/.local/bin/llm-mem-mcp'
            echo 'chmod +x ~/.local/bin/llm-mem-mcp'
            echo ''
            echo '# Configure your MCP client (Claude Code, Claude Desktop, etc.)'
            echo '# Example ~/.claude.json:'
            echo '{'
            echo '  "mcpServers": {'
            echo '    "llm-mem": {'
            echo '      "command": "/home/you/.local/bin/llm-mem-mcp",'
            echo '      "args": []'
            echo '    }'
            echo '  }'
            echo '}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
